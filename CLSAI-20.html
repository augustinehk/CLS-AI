                                                    <button
                                                        onClick={() => setPeekTurnMap(prev => ({ ...prev, [activeTurn.turn]: !prev[activeTurn.turn] }))}
                                                        className="ml-auto text-[11px] font-bold text-amber-700 hover:text-amber-900 bg-amber-100 hover:bg-amber-200 px-2.5 py-0.5 rounded transition-all cursor-pointer"
                                                    >
                                                        {peekTurnMap[activeTurn.turn] ? TString.hidePeekBtn : TString.peekBtn}
                                                    </button>
                                                )}
                                            </div>

                                            {/* Blind Mode Masking vs Revealed Source Text */}
                                            {isSourceTextHidden ? (
                                                <div className="bg-amber-50/90 border border-dashed border-amber-300 rounded-lg p-3.5 text-xs font-bold text-amber-900 flex items-center justify-between">
                                                    <span>{TString.blindBanner}</span>
                                                </div>
                                            ) : (
                                                <div className="text-base font-bold text-gray-900 leading-relaxed animate-fade-in">
                                                    {activeTurn.lang === "en-US" ? activeTurn.text_en : activeTurn.text_zh}
                                                </div>
                                            )}
                                        </div>
                                        <button 
                                            onClick={() => playOriginalSound(activeTurn, activeTurn.turn % 2 === 1 ? "questioner" : "answerer")} 
                                            disabled={isPlayingTTS}
                                            title="點擊播放法庭原聲"
                                            className="bg-blue-100 hover:bg-blue-200 text-blue-900 rounded-full p-3 transition-all ml-4 cursor-pointer disabled:opacity-50 shadow-sm"
                                        >
                                            {isPlayingTTS ? <Icons.Spinner /> : <Icons.Play />}
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between border-t border-b border-gray-200 py-2 px-1 border-dashed">
                                        <span className="text-xs font-bold text-gray-700">
                                            {TString.hearAndInterpret} <span className="text-amber-600 underline font-extrabold">{activeTurn.lang === "en-US" ? TString.cantonese : TString.english}</span>
                                        </span>
                                    </div>

                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center">
                                            <label className="text-xs font-bold text-gray-800">{TString.yourTranslation}</label>
                                            <button 
                                                onClick={() => handleSpeechRecognition(activeTurn.turn, activeTurn.lang === "en-US" ? "zh-HK" : "en-US")}
                                                className={`px-4 py-2 rounded-lg font-bold text-xs flex items-center space-x-1.5 transition-all text-white cursor-pointer ${isRecording && recordingTurn === activeTurn.turn ? "bg-red-600 animate-pulse" : "bg-blue-900 hover:bg-blue-800"}`}
                                            >
                                                <Icons.Mic />
                                                <span className="text-white">{isRecording && recordingTurn === activeTurn.turn ? TString.stopRecord : TString.startRecord}</span>
                                            </button>
                                        </div>

                                        {micError && (
                                            <div className="bg-rose-50 border border-rose-300 text-rose-800 rounded-lg p-3 text-xs whitespace-pre-line leading-relaxed flex justify-between items-start">
                                                <div>{micError}</div>
                                                <button onClick={() => setMicError("")} className="ml-3 text-rose-600 font-bold hover:text-rose-900">✕</button>
                                            </div>
                                        )}

                                        <textarea 
                                            rows="3"
                                            value={userTranslations[activeTurn.turn] || ""}
                                            onChange={e => setUserTranslations(prev => ({ ...prev, [activeTurn.turn]: e.target.value }))}
                                            className="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm font-semibold text-gray-900"
                                            placeholder={TString.textareaPlaceholder}
                                        />

                                        {recordedUrls[activeTurn.turn] && (
                                            <div className="bg-amber-50 border border-amber-300 rounded-lg p-3 flex flex-wrap gap-2 justify-between items-center shadow-inner">
                                                <div className="text-xs font-bold text-amber-900">{TString.playback}</div>
                                                <div className="flex items-center space-x-4">
                                                    <audio controls src={recordedUrls[activeTurn.turn]} className="h-8 max-w-xs outline-none" />
                                                    <a 
                                                        href={recordedUrls[activeTurn.turn]} 
                                                        download={`Turn_${activeTurn.turn}_Audio.webm`} 
                                                        className="text-xs font-bold text-blue-700 hover:text-blue-900 hover:underline bg-white px-2 py-1 rounded border border-blue-200"
                                                    >
                                                        ⬇️ {lang === 'zh' ? '儲存語音' : 'Save Audio'}
                                                    </a>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex justify-between items-center border-t border-gray-200 pt-4">
                                        <button 
                                            onClick={() => {
                                                stopAllRecordingTracks();
                                                setCurrentTurnIdx(prev => Math.max(0, prev - 1));
                                            }}
                                            disabled={currentTurnIdx === 0}
                                            className="border border-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg text-xs flex items-center space-x-1.5 disabled:opacity-40"
                                        >
                                            <Icons.ArrowLeft />
                                            <span>{TString.prevBtn}</span>
                                        </button>
                                        <button 
                                            onClick={() => gradeStudentAnswer(activeTurn.turn, activeTurn)}
                                            disabled={isGrading}
                                            className="bg-amber-500 hover:bg-amber-600 text-blue-900 font-black py-2.5 px-6 rounded-lg text-xs flex items-center space-x-1.5 shadow disabled:opacity-50 cursor-pointer"
                                        >
                                            <Icons.Check />
                                            <span className="text-blue-900">{isGrading ? TString.gradingBtn : TString.submitBtn}</span>
                                        </button>
                                        <button 
                                            onClick={() => {
                                                stopAllRecordingTracks();
                                                setCurrentTurnIdx(prev => Math.min(Math.min(practiceTurnsLimit, currentCase.dialogue.length) - 1, prev + 1));
                                            }}
                                            disabled={currentTurnIdx >= Math.min(practiceTurnsLimit, currentCase.dialogue.length) - 1}
                                            className="bg-blue-900 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded-lg text-xs flex items-center space-x-1.5 disabled:opacity-40"
                                        >
                                            <span className="text-white">{TString.nextBtn}</span>
                                            <Icons.ArrowRight />
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {currentTurnEval && (
                                <div className="bg-white rounded-xl p-5 border border-gray-200 shadow-sm space-y-4 animate-fade-in">
                                    <div className="flex justify-between items-center border-b border-gray-200 pb-2">
                                        <h3 className="text-sm font-extrabold text-blue-900 uppercase">{TString.aiEvalTitle}</h3>
                                        <span className={`text-xs font-bold px-2.5 py-1 rounded ${currentTurnEval.engine === "glm-5.3-flash" ? "bg-indigo-100 text-indigo-800" : "bg-gray-100 text-gray-700"}`}>
                                            {currentTurnEval.engine === "glm-5.3-flash" ? "⚡ GLM 5.3 Flash 語意核證" : "⚙️ 本地規則引擎 (離線備援)"}
                                        </span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 text-sm leading-relaxed">
                                        <div className="bg-rose-50 border border-rose-200 rounded p-3 text-gray-900">
                                            <div className="font-extrabold text-rose-800 mb-1">{TString.yourInput}</div>
                                            {userTranslations[activeTurn.turn] || "---"}
                                        </div>
                                        <div className="bg-emerald-50 border border-emerald-200 rounded p-3 text-gray-900">
                                            <div className="font-extrabold text-emerald-800 mb-1">{TString.suggestedAns}</div>
                                            {activeTurn.lang === "en-US" ? activeTurn.targetText_zh : activeTurn.targetText_en}
                                        </div>
                                    </div>
                                    <div className="space-y-2 mt-4 text-sm text-gray-800">
                                        <div className="font-bold text-emerald-700">{TString.strengths}</div>
                                        <ul className="list-disc pl-5">
                                            {currentTurnEval.strengths.map((s, i) => <li key={i}>{s}</li>)}
                                        </ul>
                                        <div className="font-bold text-rose-700 mt-2">{TString.improvements}</div>
                                        <ul className="list-disc pl-5">
                                            {currentTurnEval.improvements.map((s, i) => <li key={i}>{s}</li>)}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {/* Importer Panel */}
                            <div className="bg-white rounded-xl p-5 border border-gray-200 shadow-sm space-y-4 animate-fade-in">
                                <h2 className="text-sm font-bold text-blue-900 flex items-center space-x-2 border-b border-gray-200 pb-2">
                                    <span className="text-blue-900 uppercase">{TString.customImportTitle}</span>
                                </h2>
                                <p className="text-xs text-gray-600 leading-relaxed">
                                    {TString.customImportDesc}
                                </p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-gray-500">{TString.uploadFile}</label>
                                        <input 
                                            type="file" 
                                            accept=".docx,.pdf,.txt,.json"
                                            onChange={handleDocUpload}
                                            className="w-full text-xs border border-dashed border-gray-300 rounded-lg p-2.5 bg-gray-50 cursor-pointer text-gray-700"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-gray-500">{TString.apiKey}</label>
                                        <input 
                                            type="password" 
                                            placeholder="sk-or-v1-... (OpenRouter Key)"
                                            value={openRouterApiKey}
                                            onChange={e => setOpenRouterApiKey(e.target.value)}
                                            className="w-full text-xs p-2.5 border border-gray-300 rounded-lg text-gray-900"
                                        />
                                    </div>
                                </div>

                                <textarea 
                                    rows="3"
                                    placeholder={TString.importPlaceholder}
                                    value={customBriefText}
                                    onChange={e => setCustomBriefText(e.target.value)}
                                    className="w-full text-xs border border-gray-300 rounded-lg p-3 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-blue-900 leading-relaxed text-gray-900"
                                />

                                <div className="flex justify-between items-center flex-wrap gap-4">
                                    <div className="flex items-center space-x-4">
                                        <div className="flex items-center space-x-2">
                                            <label className="text-xs font-bold text-gray-600">{TString.category}</label>
                                            <select 
                                                value={saveToCategory} 
                                                onChange={e => setSaveToCategory(e.target.value)}
                                                className="bg-gray-50 border border-gray-300 rounded text-xs p-1.5 font-bold text-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-900"
                                            >
                                                <option value="criminal">{TString.criminal}</option>
                                                <option value="civil">{TString.civil}</option>
                                                <option value="custom">{TString.custom}</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleAISummonCourtroom}
                                        disabled={isGeneratingCase}
                                        className="bg-blue-900 hover:bg-blue-800 text-white font-bold py-2 px-6 rounded-lg text-xs flex items-center space-x-1.5 transition-all disabled:opacity-50"
                                    >
                                        <span className="text-white">{isGeneratingCase ? TString.generating : TString.generateBtn}</span>
                                    </button>
                                </div>
                            </div>

                            {/* Unified Performance Evaluation Dashboard */}
                            <div className="bg-white rounded-xl p-5 border border-gray-200 shadow-sm space-y-4">
                                <div className="flex justify-between items-center border-b border-gray-200 pb-2">
                                    <h2 className="text-sm font-bold text-blue-900 flex items-center space-x-2">
                                        <Icons.Report />
                                        <span className="text-blue-900 uppercase">{TString.dashboardTitle} (共 {activeDialogueSlice.length} 題)</span>
                                    </h2>
                                    <button 
                                        onClick={handleOpenHTMLReport}
                                        className="bg-blue-900 hover:bg-blue-800 text-white font-bold py-1.5 px-4 rounded-lg text-xs flex items-center space-x-1.5 transition-all shadow cursor-pointer"
                                    >
                                        <span className="text-white">{TString.openCertBtn}</span>
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-5 gap-3 text-center">
                                    <div className="bg-gray-50 p-3 rounded border border-gray-200">
                                        <div className="text-xs font-bold text-gray-500 uppercase">{TString.avgAcc}</div>
                                        <div className="text-base font-extrabold text-blue-900 mt-0.5">{avgAccuracy} <span className="text-xs text-gray-400">/5.0</span></div>
                                    </div>
                                    <div className="bg-gray-50 p-3 rounded border border-gray-200">
                                        <div className="text-xs font-bold text-gray-500 uppercase">{TString.avgTone}</div>
                                        <div className="text-base font-extrabold text-blue-900 mt-0.5">{avgTone} <span className="text-xs text-gray-400">/5.0</span></div>
                                    </div>
                                    <div className="bg-gray-50 p-3 rounded border border-gray-200">
                                        <div className="text-xs font-bold text-gray-500 uppercase">{TString.avgLegal}</div>
                                        <div className="text-base font-extrabold text-blue-900 mt-0.5">{avgLegal} <span className="text-xs text-gray-400">/5.0</span></div>
                                    </div>
                                    <div className="bg-gray-50 p-3 rounded border border-gray-200">
                                        <div className="text-xs font-bold text-gray-500 uppercase">{TString.avgDel}</div>
                                        <div className="text-base font-extrabold text-blue-900 mt-0.5">{avgDelivery} <span className="text-xs text-gray-400">/5.0</span></div>
                                    </div>
                                    <div className="bg-blue-50 p-3 rounded border border-blue-200 col-span-2 md:col-span-1">
                                        <div className="text-xs font-bold text-blue-700 uppercase">{TString.overallIdx}</div>
                                        <div className="text-base font-black text-blue-900 mt-0.5">{finalOverallIndex} <span className="text-xs text-blue-500">/5.0</span></div>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs border-collapse">
                                        <thead>
                                            <tr className="bg-gray-100 text-gray-700 font-bold border-b border-gray-200">
                                                <th className="p-2">Turn</th>
                                                <th className="p-2">Role</th>
                                                <th className="p-2">Your Translation</th>
                                                <th className="p-2 text-center">Acc.</th>
                                                <th className="p-2 text-center">Tone</th>
                                                <th className="p-2 text-center">Legal</th>
                                                <th className="p-2 text-center">Deliv.</th>
                                                <th className="p-2 text-center">Score</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {activeDialogueSlice.map((turn, i) => {
                                                const scoreInfo = aiEvaluations[turn.turn];
                                                const isCurrent = turn.turn === activeTurn.turn;
                                                
                                                let studentTextSnippet = userTranslations[turn.turn] || "---";
                                                if (studentTextSnippet.length > 15) {
                                                    studentTextSnippet = studentTextSnippet.substring(0, 15) + "...";
                                                }

                                                return (
                                                    <tr 
                                                        key={i} 
                                                        onClick={() => {
                                                            stopAllRecordingTracks();
                                                            setCurrentTurnIdx(i);
                                                        }}
                                                        className={`border-b border-gray-200 cursor-pointer transition-all ${isCurrent ? "bg-blue-50 font-bold text-blue-900" : "hover:bg-gray-50 text-gray-600"}`}
                                                    >
                                                        <td className="p-2">{turn.turn}</td>
                                                        <td className="p-2">{lang === 'zh' ? turn.role_zh : turn.role_en}</td>
                                                        <td className="p-2 italic">{studentTextSnippet}</td>
                                                        <td className="p-2 text-center">{scoreInfo ? scoreInfo.scores.accuracy : "-"}</td>
                                                        <td className="p-2 text-center">{scoreInfo ? scoreInfo.scores.tone : "-"}</td>
                                                        <td className="p-2 text-center">{scoreInfo ? scoreInfo.scores.legal : "-"}</td>
                                                        <td className="p-2 text-center">{scoreInfo ? scoreInfo.scores.delivery : "-"}</td>
                                                        <td className="p-2 text-center font-bold text-blue-900">{scoreInfo ? scoreInfo.scores.overall : "-"}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            
                        </div>
                    </div>

                    <footer className="bg-gray-100 border-t border-gray-200 py-4 text-center text-xs text-gray-500">
                        &copy; 2026 法庭語文組 (Court Language Section) - 實戰口譯及 AI 核證質素培訓模擬系統。
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
