        // Helper: Wrap raw 16-bit mono PCM bytes into a playable WAV Blob
        function pcmToWavBlob(pcmArrayBuffer, sampleRate = 24000, numChannels = 1) {
            const pcmBytes = new Uint8Array(pcmArrayBuffer);
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;

            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + pcmBytes.byteLength, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, pcmBytes.byteLength, true);

            return new Blob([wavHeader, pcmBytes], { type: 'audio/wav' });
        }

        // Helper: Convert Blob to Base64 Data URL for JSON Pre-baking
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

                    { "turn": 8, "role_zh": "第一被告", "role_en": "1st Defendant", "lang": "zh-HK", "text_zh": "我見佢推到差啲仆低，咪出於好心幫手扶一扶囉！嗰陣我邊度知個膠籃入面裝住個夾萬同幾萬蚊現金吖！", "text_en": "我見佢推到差啲仆低，咪出於好心幫手扶一扶囉！嗰陣我邊度知個膠籃入面裝住個夾萬同幾萬蚊現金吖！", "targetText_zh": "我見佢推到差啲仆低，咪出於好心幫手扶一扶囉！嗰陣我邊度知個膠籃入面裝住個夾萬同幾萬蚊現金吖！", "targetText_en": "I saw he was pushing it and almost fell over, so I helped to balance it out of good intentions! How would I know the plastic basket contained a safe and tens of thousands of dollars in cash at that time?!" },
                    { "turn": 9, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Are you seriously asking the court to believe that you didn't notice the large white paper label on the basket clearly stating '100% Metro Harbour Plaza'?", "text_en": "Are you seriously asking the court to believe that you didn't notice the large white paper label on the basket clearly stating '100% Metro Harbour Plaza'?", "targetText_zh": "你係咪認真要求法庭相信，你留意唔到膠籃外面貼住一張好大嘅白紙，清楚寫住「百分百港灣豪庭」？", "targetText_en": "Are you seriously asking the court to believe that you didn't notice the large white paper label on the basket clearly stating '100% Metro Harbour Plaza'?" },
                    { "turn": 10, "role_zh": "第一被告", "role_en": "1st Defendant", "lang": "zh-HK", "text_zh": "天色咁黑，我根本冇為意出面貼咗咩紙。再講，我問佢啲嘢邊度嚟，佢答完我之後我已經即刻用粗口鬧佢啦！", "text_en": "天色咁黑，我根本冇為意出面貼咗咩紙。再講，我問佢啲嘢邊度嚟，佢答完我之後我已經即刻用粗口鬧佢啦！", "targetText_zh": "天色咁黑，我根本冇為意出面貼咗咩紙。再講，我問佢啲嘢邊度嚟，佢答完我之後我已經即刻用粗口鬧佢啦！", "targetText_en": "The sky was so dark, I simply didn't notice what paper was attached outside. Furthermore, when I asked him where the things came from and he replied, I immediately scolded him with foul language!" },
                    { "turn": 11, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Yet, after supposedly scolding him, you still took a taxi with D2 and D3 to Hoi Au House, bringing the stolen safe with you.", "text_en": "Yet, after supposedly scolding him, you still took a taxi with D2 and D3 to Hoi Au House, bringing the stolen safe with you.", "targetText_zh": "然而，喺你聲稱鬧完佢之後，你仍然同第二及第三被告一齊搭的士去海鷗樓，仲帶埋個偷返嚟嘅保險箱。", "targetText_en": "Yet, after supposedly scolding him, you still took a taxi with D2 and D3 to Hoi Au House, bringing the stolen safe with you." },
                    { "turn": 12, "role_zh": "第一被告", "role_en": "1st Defendant", "lang": "zh-HK", "text_zh": "因為佢話返到屋企先有錢還畀我吖嘛！我為咗追番借出去嗰三百蚊，唯有頂硬上跟埋佢哋上去囉。", "text_en": "因為佢話返到屋企先有錢還畀我吖嘛！我為咗追番借出去嗰三百蚊，唯有頂硬上跟埋佢哋上去囉。", "targetText_zh": "因為佢話返到屋企先有錢還畀我吖嘛！我為咗追番借出去嗰三百蚊，唯有頂硬上跟埋佢哋上去囉。", "targetText_en": "Because he said he would only have money to pay me back when he got home! In order to get back the 300 dollars I lent out, I had no choice but to bite the bullet and follow them up." },
                    { "turn": 13, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "I challenge your assertion. You paid $280 for the taxi fare just to collect a $300 debt. Does that make any logical sense to you?", "text_en": "I challenge your assertion. You paid $280 for the taxi fare just to collect a $300 debt. Does that make any logical sense to you?", "targetText_zh": "我對你嘅說法提出質疑。你畀咗二百八十蚊的士錢，只係為咗收番三百蚊嘅欠款。你覺得噉樣合乎邏輯咩？", "targetText_en": "I challenge your assertion. You paid $280 for the taxi fare just to collect a $300 debt. Does that make any logical sense to you?" },
                    { "turn": 14, "role_zh": "第一被告", "role_en": "1st Defendant", "lang": "zh-HK", "text_zh": "三百蚊都係錢吖！我窮吖嘛，事後佢喺單位入面畀返五百八十蚊我，連埋車錢找數，有咩問題先？", "text_en": "三百蚊都係錢吖！我窮吖嘛，事後佢喺單位入面畀返五百八十蚊我，連埋車錢找數，有咩問題先？", "targetText_zh": "三百蚊都係錢吖！我窮吖嘛，事後佢喺單位入面畀返五百八十蚊我，連埋車錢找數，有咩問題先？", "targetText_en": "300 dollars is still money! I am poor. Afterwards, he gave me back 580 dollars inside the flat, settling the debt including the taxi fare. What is the problem with that?" },
                    { "turn": 15, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "If you had FPS set up on your phone, you could have easily asked him to transfer the money electronically instead of making this elaborate trip.", "text_en": "If you had FPS set up on your phone, you could have easily asked him to transfer the money electronically instead of making this elaborate trip.", "targetText_zh": "如果你電話有安裝轉數快（FPS），你好輕易就可以叫佢電子轉帳還錢，而唔需要大費周章去呢趟旅程。", "targetText_en": "If you had FPS set up on your phone, you could have easily asked him to transfer the money electronically instead of making this elaborate trip." },
                    { "turn": 16, "role_zh": "第一被告", "role_en": "1st Defendant", "lang": "zh-HK", "text_zh": "佢話淨係得現金吖嘛！如果我唔跟埋去，分分鐘連影都冇埋。我只係想收返自己啲錢，根本就冇參與過入屋爆竊！", "text_en": "佢話淨係得現金吖嘛！如果我唔跟埋去，分分鐘連影都冇埋。我只係想收返自己啲錢，根本就冇參與過入屋爆竊！", "targetText_zh": "佢話淨係得現金吖嘛！如果我唔跟埋去，分分鐘連影都冇埋。我只係想收返自己啲錢，根本就冇參與過入屋爆竊！", "targetText_en": "He said he only had cash! If I didn't tag along, he might have disappeared without a trace. I just wanted to get my money back, and simply never participated in the burglary!" },
                    { "turn": 17, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "I put it to you that the entire story about lending $300 is a complete fabrication designed to conceal your role as the getaway driver.", "text_en": "I put it to you that the entire story about lending $300 is a complete fabrication designed to conceal your role as the getaway driver.", "targetText_zh": "我向你指出，成個關於借三百蚊嘅古仔完全係捏造出嚟嘅，目的係為咗掩飾你作為接應司機嘅角色。", "targetText_en": "I put it to you that the entire story about lending $300 is a complete fabrication designed to conceal your role as the getaway driver." },
                    { "turn": 18, "role_zh": "第一被告", "role_en": "1st Defendant", "lang": "zh-HK", "text_zh": "我冇作故仔！所有閉路電視都見唔到我入過去間餐廳。你哋而家係見我出現喺附近，就想夾硬砌我生豬肉！", "text_en": "我冇作故仔！所有閉路電視都見唔到我入過去間餐廳。你哋而家係見我出現喺附近，就想夾硬砌我生豬肉！", "targetText_zh": "我冇作故仔！所有閉路電視都見唔到我入過去間餐廳。你哋而家係見我出現喺附近，就想夾硬砌我生豬肉！", "targetText_en": "I am not making up stories! None of the CCTVs show me entering that restaurant. You guys are just seeing me appear nearby and trying to frame me up forcefully!" },
                    { "turn": 19, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "I suggest to you that you were a fully aware and active member of this joint enterprise, helping to transport the stolen property with your bicycle.", "text_en": "I suggest to you that you were a fully aware and active member of this joint enterprise, helping to transport the stolen property with your bicycle.", "targetText_zh": "我向你指出，你係完全知情並且積極參與呢次共同犯罪計劃嘅成員，利用你架單車協助運送失竊財物。", "targetText_en": "I suggest to you that you were a fully aware and active member of this joint enterprise, helping to transport the stolen property with your bicycle." },
                    { "turn": 20, "role_zh": "第一被告", "role_en": "1st Defendant", "lang": "zh-HK", "text_zh": "我絕對不同意！由頭到尾我只係借錢畀朋友，你哋講到我好似主謀咁，簡直係不分青紅皂白！", "text_en": "我絕對不同意！由頭到尾我只係借錢畀朋友，你哋講到我好似主謀咁，簡直係不分青紅皂白！", "targetText_zh": "我絕對不同意！由頭到尾我只係借錢畀朋友，你哋講到我好似主謀咁，簡直係不分青紅皂白！", "targetText_en": "I absolutely disagree! From beginning to end, I was only lending money to a friend. You are describing me as if I were the mastermind; this is completely confusing right and wrong!" }
                ]
            },
            {
                id: "preset_hcma_314_extended",
                title_zh: "刑事 ➜ [擴充版] 戲院通道非禮及刑事恐嚇案 (HCMA 314/2013)",
                title_en: "Criminal ➜ [Extended] Cinema Indecent Assault (HCMA 314/2013)",
                category: "criminal",
                desc_zh: "改編自高等法院真實案件。涉及被告在通道捏事主臀部並伴隨「刑事恐嚇」言語。已擴充至20輪，後半段加入辯方大律師的嚴厲盤問，質疑事主因踩鞋糾紛而惡意誣陷，考驗高壓攻防下的口譯能力。",
                desc_en: "Adapted from real high court appeal. Focuses on physical touching descriptors and aggressive criminal intimidation phrases. Extended to 20 turns featuring rigorous cross-examination by Defense Counsel challenging the victim's credibility.",
                dialogue: [
                    { "turn": 1, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Miss Leung, you felt that something like the knuckle of a fist pressed closely against your left buttock, correct?", "text_en": "Miss Leung, you felt that something like the knuckle of a fist pressed closely against your left buttock, correct?", "targetText_zh": "梁小姐，你當時感覺到有類似拳頭關節嘅物體緊貼住你嘅左邊臀部，係咪？", "targetText_en": "Miss Leung, you felt that something like the knuckle of a fist pressed closely against your left buttock, correct?" },
                    { "turn": 2, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "係呀，個觸碰貼住咗成一秒鐘度，絕對唔係無意中掃過嗰隻囉！", "text_en": "係呀，個觸碰貼住咗成一秒鐘度，絕對唔係無意中掃過嗰隻囉！", "targetText_zh": "係呀，個觸碰貼住咗成一秒鐘度，絕對唔係無意中掃過嗰隻囉！", "targetText_en": "Yes, that touching remained in contact for about one second; it was absolutely not a brushing movement!" },
                    { "turn": 3, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "And when you turned around to check, where was the defendant situated?", "text_en": "And when you turned around to check, where was the defendant situated?", "targetText_zh": "當你轉身查看嘅時候，被告人位於邊個位置？", "targetText_en": "And when you turned around to check, where was the defendant situated?" },
                    { "turn": 4, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "佢企喺我左後方，少過一呎。佢一邊迴避我嘅眼神，一邊東張西望扮衰人囉。", "text_en": "佢企喺我左後方，少過一呎。佢一邊迴避我嘅眼神，一邊東張西望扮衰人囉。", "targetText_zh": "佢企喺我左後方，少過一呎。佢一邊迴避我嘅眼神，一邊東張西望扮衰人囉。", "targetText_en": "He stood at less than one foot behind my left rear. He avoided my eyes and looked around evasively." },
                    { "turn": 5, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Did a similar touching occur again after you quickened your pace?", "text_en": "Did a similar touching occur again after you quickened your pace?", "targetText_zh": "當你加快腳步之後，係咪再次發生咗類似嘅觸碰？", "targetText_en": "Did a similar touching occur again after you quickened your pace?" },
                    { "turn": 6, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "係！我行多八至十步之後又被摸，今次佢隻手離我屁股得五吋，肯定唔係意外！", "text_en": "係！我行多八至十步之後又被摸，今次佢隻手離我屁股得五吋，肯定唔係意外！", "targetText_zh": "係！我行多八至十步之後又被摸，今次佢隻手離我屁股得五吋，肯定唔係意外！", "targetText_en": "Yes! After walking another eight to ten steps, it happened again. His hand was only five inches away from my buttock; it was definitely not an accident!" },
                    { "turn": 7, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "What happened when you accidentally stepped on the back of his shoes near the exit?", "text_en": "What happened when you accidentally stepped on the back of his shoes near the exit?", "targetText_zh": "當你喺出口附近唔小心踩到佢鞋踭嘅時候，發生咗咩事？", "targetText_en": "What happened when you accidentally stepped on the back of his shoes near the exit?" },
                    { "turn": 8, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "佢發晒脾氣轉身大聲鬧我：「你使唔使踩到我呀？！」仲夾雜好多粗言穢語囉。", "text_en": "佢發晒脾氣轉身大聲鬧我：「你使唔使踩到我呀？！」仲夾雜好多粗言穢語囉。", "targetText_zh": "佢發晒脾氣轉身大聲鬧我：「你使唔使踩到我呀？！」仲夾雜好多粗言穢語囉。", "targetText_en": "He turned around with some agitation and said, 'You don't have to step on me, do you?' and swore." },
                    { "turn": 9, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "When you accused him of the indecent assault, what was his immediate response?", "text_en": "When you accused him of the indecent assault, what was his immediate response?", "targetText_zh": "當你指控佢非禮你嘅時候，佢即時有咩反應？", "targetText_en": "When you accused him of the indecent assault, what was his immediate response?" },
                    { "turn": 10, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "佢兇神惡煞咁對我大喊：「黐線！我幾時非禮你？你用水照吓個樣，信唔信我打你？！」", "text_en": "佢兇神惡煞咁對我大喊：「黐線！我幾時非禮你？你用水照吓個樣，信唔信我打你？！」", "targetText_zh": "佢兇神惡煞咁對我大喊：「黐線！我幾時非禮你？你用水照吓個樣，信唔信我打你？！」", "targetText_en": "He yelled fiercely at me: 'Crazy, when did I indecently assault you? Look at your face in the water. Do you believe that I hit you?!'" },
                    { "turn": 11, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Miss Leung, I put it to you that the cinema corridor was extremely crowded and dimly lit, making any contact purely accidental.", "text_en": "Miss Leung, I put it to you that the cinema corridor was extremely crowded and dimly lit, making any contact purely accidental.", "targetText_zh": "梁小姐，我向你指出，戲院通道當時非常擠迫而且燈光昏暗，任何身體接觸純粹係意外。", "targetText_en": "Miss Leung, I put it to you that the cinema corridor was extremely crowded and dimly lit, making any contact purely accidental." },
                    { "turn": 12, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "我絕對唔同意。嗰個唔係普通碰撞，我清楚感覺到有硬物大力「㨃」咗我兩下囉！", "text_en": "我絕對唔同意。嗰個唔係普通碰撞，我清楚感覺到有硬物大力「㨃」咗我兩下囉！", "targetText_zh": "我絕對唔同意。嗰個唔係普通碰撞，我清楚感覺到有硬物大力「㨃」咗我兩下囉！", "targetText_en": "I absolutely disagree. That was not a normal bump; I clearly felt a hard object poking me forcefully twice!" },
                    { "turn": 13, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "If the contact was so distinct, why didn't you scream for help immediately instead of merely quickening your pace?", "text_en": "If the contact was so distinct, why didn't you scream for help immediately instead of merely quickening your pace?", "targetText_zh": "如果個接觸係咁明顯，點解你唔即刻大叫救命，而只係加快腳步？", "targetText_en": "If the contact was so distinct, why didn't you scream for help immediately instead of merely quickening your pace?" },
                    { "turn": 14, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "我當時嚇到呆咗呀嘛！我一個女仔人家，喺嗰種情況下點識即刻反應呀？", "text_en": "我當時嚇到呆咗呀嘛！我一個女仔人家，喺嗰種情況下點識即刻反應呀？", "targetText_zh": "我當時嚇到呆咗呀嘛！我一個女仔人家，喺嗰種情況下點識即刻反應呀？", "targetText_en": "I was scared stiff at that time! I am a girl, how would I know to react instantly in that situation?" },
                    { "turn": 15, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "I suggest to you that you intentionally stepped on his shoe to provoke him because you were agitated by the crowded environment.", "text_en": "I suggest to you that you intentionally stepped on his shoe to provoke him because you were agitated by the crowded environment.", "targetText_zh": "我向你指出，你係蓄意踩佢鞋踭去挑釁佢，因為你對擠迫嘅環境感到煩躁。", "targetText_en": "I suggest to you that you intentionally stepped on his shoe to provoke him because you were agitated by the crowded environment." },
                    { "turn": 16, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "絕對冇啲噉嘅事！係佢貼得我太近，我停低嗰陣先會唔小心踩到佢腳踭。", "text_en": "絕對冇啲噉嘅事！係佢貼得我太近，我停低嗰陣先會唔小心踩到佢腳踭。", "targetText_zh": "絕對冇啲噉嘅事！係佢貼得我太近，我停低嗰陣先會唔小心踩到佢腳踭。", "targetText_en": "Absolutely no such thing! He was tailing me too closely, that's why I accidentally stepped on his heel when I stopped." },
                    { "turn": 17, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "And his subsequent verbal outburst was merely a natural reaction of a person being stepped on, rather than an indication of a guilty conscience.", "text_en": "And his subsequent verbal outburst was merely a natural reaction of a person being stepped on, rather than an indication of a guilty conscience.", "targetText_zh": "而佢隨後嘅言語爆發，純粹係一個被人踩到嘅人嘅自然反應，而唔係做賊心虛嘅表現。", "targetText_en": "And his subsequent verbal outburst was merely a natural reaction of a person being stepped on, rather than an indication of a guilty conscience." },
                    { "turn": 18, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "自然反應？一個正常人會因為被人踩到隻鞋，就恐嚇話要打女人同埋狂爆粗㗎咩？", "text_en": "自然反應？一個正常人會因為被人踩到隻鞋，就恐嚇話要打女人同埋狂爆粗㗎咩？", "targetText_zh": "自然反應？一個正常人會因為被人踩到隻鞋，就恐嚇話要打女人同埋狂爆粗㗎咩？", "targetText_en": "Natural reaction? Would a normal person threaten to hit a woman and wildly use foul language just because his shoe was stepped on?" },
                    { "turn": 19, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Let me suggest to the court that your entire allegation of indecent assault is a malicious exaggeration fabricated out of your anger from this trivial shoe-stepping quarrel.", "text_en": "Let me suggest to the court that your entire allegation of indecent assault is a malicious exaggeration fabricated out of your anger from this trivial shoe-stepping quarrel.", "targetText_zh": "等我向法庭指出，你成個非禮嘅指控，都係出於你對呢場踩鞋小糾紛嘅憤怒，而捏造出嚟嘅惡意誇大。", "targetText_en": "Let me suggest to the court that your entire allegation of indecent assault is a malicious exaggeration fabricated out of your anger from this trivial shoe-stepping quarrel." },
                    { "turn": 20, "role_zh": "事主 梁小姐", "role_en": "Victim Miss Leung", "lang": "zh-HK", "text_zh": "你根本就係顛倒是非！我點會攞自己女仔人家嘅聲譽嚟屈佢「生豬肉」呀？我句句都係真㗎囉！", "text_en": "你根本就係顛倒是非！我點會攞自己女仔人家嘅聲譽嚟屈佢「生豬肉」呀？我句句都係真㗎囉！", "targetText_zh": "你根本就係顛倒是非！我點會攞自己女仔人家嘅聲譽嚟屈佢「生豬肉」呀？我句句都係真㗎囉！", "targetText_en": "You are simply confusing right and wrong! Why would I risk a girl's reputation to frame him? Every word I said is true!" }
                ]
            },
            {
                id: "preset_hcma_559_extended",
                title_zh: "刑事 ➜ [擴充版] 酒吧啤酒推廣員非禮及脅迫案 (HCMA 559/2013)",
                title_en: "Criminal ➜ [Extended] Beer Promoter Indecent Assault (HCMA 559/2013)",
                category: "criminal",
                desc_zh: "改編自酒吧推廣員受襲及非禮案。已擴充至20輪。前半段為控方主問，後半段加入辯方大律師對事主職業性質及案發反應的嚴厲盤問，質疑其為「屈錢」而誇大醉酒客人的舉動。考驗「打龍通、兜巴星、含血噴人」等街頭俚語傳譯。",
                desc_en: "Adapted from a bar assault and indecent assault case. Extended to 20 turns. The second half features rigorous cross-examination by the Defense Counsel questioning the victim's job nature, reaction, and motives, testing the interpretation of highly colloquial Cantonese slangs.",
                dialogue: [
                    { "turn": 1, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Miss Wong, as a part-time beer promoter, is it your job requirement to always maintain a smile and avoid offending customers?", "text_en": "Miss Wong, as a part-time beer promoter, is it your job requirement to always maintain a smile and avoid offending customers?", "targetText_zh": "黃小姐，作為兼職啤酒推銷員，保持笑容同避免得失客人係咪你嘅工作基本要求？", "targetText_en": "Miss Wong, as a part-time beer promoter, is it your job requirement to always maintain a smile and avoid offending customers?" },
                    { "turn": 2, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "係，所以我哋斟酒嗰陣，就算俾人摸手摸腳，都只可以吞聲忍氣、左閃右避囉。", "text_en": "係，所以我哋斟酒嗰陣，就算俾人摸手摸腳，都只可以吞聲忍氣、左閃右避囉。", "targetText_zh": "係，所以我哋斟酒嗰陣，就算俾人摸手摸腳，都只可以吞聲忍氣、左閃右避囉。", "targetText_en": "Yes, so when we pour beer, even if we are groped, we can only put up with it, dodge and step back." },
                    { "turn": 3, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "On the night in question, what did the first defendant (D1) do to you suddenly while you were waiting for customers?", "text_en": "On the night in question, what did the first defendant (D1) do to you suddenly while you were waiting for customers?", "targetText_zh": "在案發當晚，當你等候客人嘅時候，第一被告人（D1）突然對你做咗啲咩？", "targetText_en": "On the night in question, what did the first defendant (D1) do to you suddenly while you were waiting for customers?" },
                    { "turn": 4, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "佢突然衝上前，迎面格硬將我成個人抱起、抱到離晒地，搞到我胸口都撞到佢膊頭囉。", "text_en": "佢突然衝上前，迎面格硬將我成個人抱起、抱到離晒地，搞到我胸口都撞到佢膊頭囉。", "targetText_zh": "佢突然衝上前，迎面格硬將我成個人抱起、抱到離晒地，搞到我胸口都撞到佢膊頭囉。", "targetText_en": "He suddenly dashed forward and lifted me off the ground with his arms when we were facing each other, causing my chest to contact his shoulder." },
                    { "turn": 5, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "When you prepared to leave near the main entrance, did the third defendant (D3) use physical violence against you?", "text_en": "When you prepared to leave near the main entrance, did the third defendant (D3) use physical violence against you?", "targetText_zh": "當你預備喺正門離開嘅時候，第三被告人（D3）有無對你實施身體暴力？", "targetText_en": "When you prepared to leave near the main entrance, did the third defendant (D3) use physical violence against you?" },
                    { "turn": 6, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "佢突然一巴掌打落我塊面度，兇我話要留低陪佢哋飲酒，跟住D1又上來格硬摟抱我，搞到我件衫都被掀開晒！", "text_en": "佢突然一巴掌打落我塊面度，兇我話要留低陪佢哋飲酒，跟住D1又上來格硬摟抱我，搞到我件衫都被掀開晒！", "targetText_zh": "佢突然一巴掌打落我塊面度，兇我話要留低陪佢哋飲酒，跟住D1又上來格硬摟抱我，搞到我件衫都被掀開晒！", "targetText_en": "He suddenly slapped me on my face, threatening me to stay and drink, and then D1 came over and hugged me vigorously, pulling my clothing aside!" },
                    { "turn": 7, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Did D1 and D3 appear to be acting together to prevent you from leaving the bar?", "text_en": "Did D1 and D3 appear to be acting together to prevent you from leaving the bar?", "targetText_zh": "D1同D3當時睇起嚟係咪共同行事，以阻止你離開酒吧？", "targetText_en": "Did D1 and D3 appear to be acting together to prevent you from leaving the bar?" },
                    { "turn": 8, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "係呀！佢哋根本就係打龍通，一個打我兇我，另一個就乘機抽水，夾手夾腳阻住我走囉！", "text_en": "係呀！佢哋根本就係打龍通，一個打我兇我，另一個就乘機抽水，夾手夾腳阻住我走囉！", "targetText_zh": "係呀！佢哋根本就係打龍通，一個打我兇我，另一個就乘機抽水，夾手夾腳阻住我走囉！", "targetText_en": "Yes! They were basically acting in concert. One hit and threatened me, and the other took the opportunity to take advantage of me, teaming up to block me from leaving!" },
                    { "turn": 9, "role_zh": "控方大律師", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "How did you eventually manage to escape from their physical restraint?", "text_en": "How did you eventually manage to escape from their physical restraint?", "targetText_zh": "你最終點樣成功擺脫佢哋嘅身體限制逃走？", "targetText_en": "How did you eventually manage to escape from their physical restraint?" },
                    { "turn": 10, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "我當時喊到收唔到聲，出盡全力推開D1，跟住即刻衝出門口搵經理求救。", "text_en": "我當時喊到收唔到聲，出盡全力推開D1，跟住即刻衝出門口搵經理求救。", "targetText_zh": "我當時喊到收唔到聲，出盡全力推開D1，跟住即刻衝出門口搵經理求救。", "targetText_en": "I was crying non-stop at that time, pushed D1 away with all my might, and then immediately rushed out the door to seek help from the manager." },
                    { "turn": 11, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Miss Wong, I put it to you that the atmosphere in the bar was highly chaotic, and the defendants were merely joking around after consuming alcohol.", "text_en": "Miss Wong, I put it to you that the atmosphere in the bar was highly chaotic, and the defendants were merely joking around after consuming alcohol.", "targetText_zh": "黃小姐，我向你指出，酒吧當時嘅氣氛非常混亂，而被告人只不過係飲醉酒之後喺度開玩笑。", "targetText_en": "Miss Wong, I put it to you that the atmosphere in the bar was highly chaotic, and the defendants were merely joking around after consuming alcohol." },
                    { "turn": 12, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "講笑？邊有正常人會將個女仔成個秤起，仲要兜巴星㗎？呢啲叫暴力同非禮囉！", "text_en": "講笑？邊有正常人會將個女仔成個秤起，仲要兜巴星㗎？呢啲叫暴力同非禮囉！", "targetText_zh": "講笑？邊有正常人會將個女仔成個秤起，仲要兜巴星㗎？呢啲叫暴力同非禮囉！", "targetText_en": "Joking? What normal person would lift a girl completely off the ground and slap her in the face? That is violence and indecent assault!" },
                    { "turn": 13, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "I suggest to you that D1 simply tripped and grabbed onto you to regain his balance, making the chest contact completely accidental.", "text_en": "I suggest to you that D1 simply tripped and grabbed onto you to regain his balance, making the chest contact completely accidental.", "targetText_zh": "我向你指出，D1純粹係絆倒，為咗恢復平衡先捉住你，令到胸部接觸完全係一場意外。", "targetText_en": "I suggest to you that D1 simply tripped and grabbed onto you to regain his balance, making the chest contact completely accidental." },
                    { "turn": 14, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "絕對冇可能！佢係迎面衝埋嚟，兩隻手夾硬箍住我條腰，點會係爭啲跌低呀？", "text_en": "絕對冇可能！佢係迎面衝埋嚟，兩隻手夾硬箍住我條腰，點會係爭啲跌低呀？", "targetText_zh": "絕對冇可能！佢係迎面衝埋嚟，兩隻手夾硬箍住我條腰，點會係爭啲跌低呀？", "targetText_en": "Absolutely impossible! He dashed forward face-to-face and forcibly grabbed my waist with both hands. How could it be that he almost fell down?" },
                    { "turn": 15, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "If you were truly terrified and assaulted, why didn't you shout for help immediately when D1 first lifted you?", "text_en": "If you were truly terrified and assaulted, why didn't you shout for help immediately when D1 first lifted you?", "targetText_zh": "如果你真係覺得驚恐同被襲擊，點解D1第一次抱起你嗰陣，你唔即刻大叫救命？", "targetText_en": "If you were truly terrified and assaulted, why didn't you shout for help immediately when D1 first lifted you?" },
                    { "turn": 16, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "現場啲音樂嘈到拆天，就算我大叫都冇人聽到啦！而且我都嚇到傻咗，根本反應唔切！", "text_en": "現場啲音樂嘈到拆天，就算我大叫都冇人聽到啦！而且我都嚇到傻咗，根本反應唔切！", "targetText_zh": "現場啲音樂嘈到拆天，就算我大叫都冇人聽到啦！而且我都嚇到傻咗，根本反應唔切！", "targetText_en": "The music at the scene was deafeningly loud. Even if I shouted loudly, nobody would have heard it! Besides, I was scared out of my wits and simply couldn't react in time!" },
                    { "turn": 17, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Let me turn your attention to your job nature. You are paid to entertain customers and sometimes tolerate their overly enthusiastic behaviour, correct?", "text_en": "Let me turn your attention to your job nature. You are paid to entertain customers and sometimes tolerate their overly enthusiastic behaviour, correct?", "targetText_zh": "等我將你嘅注意力轉去你嘅工作性質。你受薪去應酬客人，有時仲要容忍佢哋過度熱情嘅行為，係咪？", "targetText_en": "Let me turn your attention to your job nature. You are paid to entertain customers and sometimes tolerate their overly enthusiastic behaviour, correct?" },
                    { "turn": 18, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "係，我哋係要陪客，但唔代表我哋要包容被人非禮同埋毆打！我係嚟推廣啤酒，唔係嚟賣身㗎！", "text_en": "係，我哋係要陪客，但唔代表我哋要包容被人非禮同埋毆打！我係嚟推廣啤酒，唔係嚟賣身㗎！", "targetText_zh": "係，我哋係要陪客，但唔代表我哋要包容被人非禮同埋毆打！我係嚟推廣啤酒，唔係嚟賣身㗎！", "targetText_en": "Yes, we have to entertain customers, but it does not mean we have to tolerate being indecently assaulted and beaten! I am here to promote beer, not to sell my body!" },
                    { "turn": 19, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "I challenge your assertion. I suggest that you are exaggerating the incident to extort compensation from my clients.", "text_en": "I challenge your assertion. I suggest that you are exaggerating the incident to extort compensation from my clients.", "targetText_zh": "我對你嘅說法提出質疑。我向你指出，你係度誇大事件，目的係向我嘅當事人勒索賠償。", "targetText_en": "I challenge your assertion. I suggest that you are exaggerating the incident to extort compensation from my clients." },
                    { "turn": 20, "role_zh": "事主 黃小姐", "role_en": "Victim Miss Wong", "lang": "zh-HK", "text_zh": "你簡直係含血噴人！我俾人打到塊面腫晒，件衫又俾人扯開，我淨係想討回公道，絕對冇諗過屈錢囉！", "text_en": "你簡直係含血噴人！我俾人打到塊面腫晒，件衫又俾人扯開，我淨係想討回公道，絕對冇諗過屈錢囉！", "targetText_zh": "你簡直係含血噴人！我俾人打到塊面腫晒，件衫又俾人扯開，我淨係想討回公道，絕對冇諗過屈錢囉！", "targetText_en": "You are simply making malicious and false accusations! My face was swollen from being hit, and my clothes were pulled aside. I only want to seek justice and absolutely never thought of extorting money!" }
                ]
            },
            {
                id: "preset_escc_180_extended",
                title_zh: "刑事 ➜ [擴充版] 阻差辦公案 - 被告辯方案情 (ESCC 180/2020)",
                title_en: "Criminal ➜ [Extended] Obstruction of Police Duty - Defense Case (ESCC 180/2020)",
                category: "criminal",
                desc_zh: "涉及阻撓警員追截黑衣人的案件。已擴充至20輪。前半段為辯方主問，後半段為主控官對被告的極度嚴厲交叉盤問。考驗對「兵荒馬亂、屈得就屈、含血噴人」等市井防禦性俚語及主控官連擊盤問句式的傳譯。",
                desc_en: "Obstruction of Police case. Extended to 20 turns. Features Examination-in-chief by Defense Counsel, followed by extremely rigorous cross-examination by the Prosecutor. Tests interpretation of emotional defensive street slang and rapid-fire prosecutorial formulae.",
                dialogue: [
                    { "turn": 1, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Mr. Chan, regarding the incident on September 2nd, why were you standing near the water pipes at the staircase of Queen's Road Central?", "text_en": "Mr. Chan, regarding the incident on September 2nd, why were you standing near the water pipes at the staircase of Queen's Road Central?", "targetText_zh": "陳先生，關於9月2號發生嘅事件，點解你會企喺皇后大道中樓梯嘅水管附近？", "targetText_en": "Mr. Chan, regarding the incident on September 2nd, why were you standing near the water pipes at the staircase of Queen's Road Central?" },
                    { "turn": 2, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "因為嗰陣好多人跑緊落樓梯，場面好混亂。我驚啲人會撞爛條水管搞到漏水，所以我先特登企喺水管前面擋住。", "text_en": "因為嗰陣好多人跑緊落樓梯，場面好混亂。我驚啲人會撞爛條水管搞到漏水，所以我先特登企喺水管前面擋住。", "targetText_zh": "因為嗰陣好多人跑緊落樓梯，場面好混亂。我驚啲人會撞爛條水管搞到漏水，所以我先特登企喺水管前面擋住。", "targetText_en": "Because there were many people running down the stairs at that time, the scene was very chaotic. I was afraid that people would crash into and break the water pipe causing a leakage, so I purposely stood in front of the water pipe to block it." },
                    { "turn": 3, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Did you notice any person in police uniform approaching you?", "text_en": "Did you notice any person in police uniform approaching you?", "targetText_zh": "你有冇留意到有任何著住警察制服嘅人行近你？", "targetText_en": "Did you notice any person in police uniform approaching you?" },
                    { "turn": 4, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "完全冇。我只係見到有幾個著住便服、揸住警棍嘅男人衝埋嚟，佢哋冇戴委任證，所以我根本唔知佢哋係警察。", "text_en": "完全冇。我只係見到有幾個著住便服、揸住警棍嘅男人衝埋嚟，佢哋冇戴委任證，所以我根本唔知佢哋係警察。", "targetText_zh": "完全冇。我只係見到有幾個著住便服、揸住警棍嘅男人衝埋嚟，佢哋冇戴委任證，所以我根本唔知佢哋係警察。", "targetText_en": "Not at all. I only saw a few men wearing plain clothes and holding police batons rushing towards me. They did not wear warrant cards, so I simply did not know they were police officers." },
                    { "turn": 5, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Did you intentionally push PW1 and PW2 to prevent them from pursuing the men in black?", "text_en": "Did you intentionally push PW1 and PW2 to prevent them from pursuing the men in black?", "targetText_zh": "你有冇蓄意推PW1同PW2，以阻止佢哋追截黑衣人？", "targetText_en": "Did you intentionally push PW1 and PW2 to prevent them from pursuing the men in black?" },
                    { "turn": 6, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "絕對冇！我只係舉起雙手保護自己，係佢哋跑得太快收唔切掣撞埋我度，唔係我主動推佢哋。", "text_en": "絕對冇！我只係舉起雙手保護自己，係佢哋跑得太快收唔切掣撞埋我度，唔係我主動推佢哋。", "targetText_zh": "絕對冇！我只係舉起雙手保護自己，係佢哋跑得太快收唔切掣撞埋我度，唔係我主動推佢哋。", "targetText_en": "Absolutely not! I only raised both hands to protect myself. It was them who ran too fast, could not brake in time and bumped into me; it was not me taking the initiative to push them." },
                    { "turn": 7, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "I suggest to you that your claim of protecting the water pipes is complete nonsense fabricated to conceal your true intention of obstructing the police.", "text_en": "I suggest to you that your claim of protecting the water pipes is complete nonsense fabricated to conceal your true intention of obstructing the police.", "targetText_zh": "我向你指出，你聲稱保護水管完全係一派胡言，係捏造出嚟掩飾你阻撓警方嘅真正意圖。", "targetText_en": "I suggest to you that your claim of protecting the water pipes is complete nonsense fabricated to conceal your true intention of obstructing the police." },
                    { "turn": 8, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "我不同意。我住喺附近，條水管爆過幾次搞到好麻煩，我出於好心保護公物有咩問題？", "text_en": "我不同意。我住喺附近，條水管爆過幾次搞到好麻煩，我出於好心保護公物有咩問題？", "targetText_zh": "我不同意。我住喺附近，條水管爆過幾次搞到好麻煩，我出於好心保護公物有咩問題？", "targetText_en": "I disagree. I live nearby, and the water pipe had burst several times causing a lot of trouble. What is the problem with me protecting public property out of good intentions?" },
                    { "turn": 9, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Even if they were in plain clothes, they were holding police batons and shouting 'Police! Stop!'. Are you telling the court you didn't hear that?", "text_en": "Even if they were in plain clothes, they were holding police batons and shouting 'Police! Stop!'. Are you telling the court you didn't hear that?", "targetText_zh": "就算佢哋著便服，佢哋都揸住警棍同大叫「警察！停低！」。你係咪同法庭講你聽唔到？", "targetText_en": "Even if they were in plain clothes, they were holding police batons and shouting 'Police! Stop!'. Are you telling the court you didn't hear that?" },
                    { "turn": 10, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "當時周圍好嘈，有人大叫大喊，我真係聽唔清楚佢哋嗌乜。任何人都可以買支棍揸住㗎啦，唔通揸棍就一定係差人咩？", "text_en": "當時周圍好嘈，有人大叫大喊，我真係聽唔清楚佢哋嗌乜。任何人都可以買支棍揸住㗎啦，唔通揸棍就一定係差人咩？", "targetText_zh": "當時周圍好嘈，有人大叫大喊，我真係聽唔清楚佢哋嗌乜。任何人都可以買支棍揸住㗎啦，唔通揸棍就一定係差人咩？", "targetText_en": "It was very noisy around at that time, with people shouting and crying. I really could not hear clearly what they were yelling. Anyone can buy a baton and hold it; does holding a baton necessarily mean they are cops?" },
                    { "turn": 11, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Mr. Chan, I put it to you that you looked directly at PW1's warrant card hanging on his chest before you deliberately body-checked him.", "text_en": "Mr. Chan, I put it to you that you looked directly at PW1's warrant card hanging on his chest before you deliberately body-checked him.", "targetText_zh": "陳先生，我向你指出，你喺蓄意用身體撞向PW1之前，係直視過佢掛喺心口嘅委任證嘅。", "targetText_en": "Mr. Chan, I put it to you that you looked directly at PW1's warrant card hanging on his chest before you deliberately body-checked him." },
                    { "turn": 12, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "絕對冇！嗰陣兵荒馬亂，啲人左穿右插，我點會留意到佢心口掛住啲乜？你根本係屈得就屈！", "text_en": "絕對冇！嗰陣兵荒馬亂，啲人左穿右插，我點會留意到佢心口掛住啲乜？你根本係屈得就屈！", "targetText_zh": "絕對冇！嗰陣兵荒馬亂，啲人左穿右插，我點會留意到佢心口掛住啲乜？你根本係屈得就屈！", "targetText_en": "Absolutely not! It was complete chaos then, people were dodging in and out, how would I notice what was hanging on his chest? You are simply framing me arbitrarily!" },
                    { "turn": 13, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "I challenge your assertion. If you were merely protecting yourself, why did PW2 suffer a bruised rib from your so-called 'protective' gesture?", "text_en": "I challenge your assertion. If you were merely protecting yourself, why did PW2 suffer a bruised rib from your so-called 'protective' gesture?", "targetText_zh": "我對你嘅說法提出質疑。如果你只不過係保護緊你自己，點解PW2會因為你所謂嘅「保護性」姿勢而導致肋骨瘀傷？", "targetText_en": "I challenge your assertion. If you were merely protecting yourself, why did PW2 suffer a bruised rib from your so-called 'protective' gesture?" },
                    { "turn": 14, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "我都話咗係佢哋跑得太快衝埋嚟囉！我自己隻手都痛到飛起啦，佢哋成班大漢夾硬撞過嚟，我邊夠力推跌佢哋呀？", "text_en": "我都話咗係佢哋跑得太快衝埋嚟囉！我自己隻手都痛到飛起啦，佢哋成班大漢夾硬撞過嚟，我邊夠力推跌佢哋呀？", "targetText_zh": "我都話咗係佢哋跑得太快衝埋嚟囉！我自己隻手都痛到飛起啦，佢哋成班大漢夾硬撞過嚟，我邊夠力推跌佢哋呀？", "targetText_en": "I already said it was them running too fast and rushing towards me! My own hands hurt terribly too. A group of big men forcefully bumped into me, how would I have the strength to push them down?" },
                    { "turn": 15, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Are you seriously asking the court to believe it's a mere coincidence that your actions allowed the three men in black to successfully escape down Queen's Road Central?", "text_en": "Are you seriously asking the court to believe it's a mere coincidence that your actions allowed the three men in black to successfully escape down Queen's Road Central?", "targetText_zh": "你係咪認真要求法庭相信，你嘅行為令到嗰三個黑衣人成功沿住皇后大道中逃脫，純粹係一場巧合？", "targetText_en": "Are you seriously asking the court to believe it's a mere coincidence that your actions allowed the three men in black to successfully escape down Queen's Road Central?" },
                    { "turn": 16, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "法官閣下，我真係唔識嗰啲黑衣人㗎！我企喺度只係為咗保住條水管，佢哋走唔走得甩關我咩事？", "text_en": "法官閣下，我真係唔識嗰啲黑衣人㗎！我企喺度只係為咗保住條水管，佢哋走唔走得甩關我咩事？", "targetText_zh": "法官閣下，我真係唔識嗰啲黑衣人㗎！我企喺度只係為咗保住條水管，佢哋走唔走得甩關我咩事？", "targetText_en": "Your Honor, I really don't know those men in black! I stood there only to protect the water pipe. What does their successful escape have to do with me?" },
                    { "turn": 17, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "I suggest to you that you are a sympathizer who deliberately used your body as a barricade to buy time for the rioters.", "text_en": "I suggest to you that you are a sympathizer who deliberately used your body as a barricade to buy time for the rioters.", "targetText_zh": "我向你指出，你係一個同情者，蓄意用你嘅身體作為路障，為暴動者爭取時間。", "targetText_en": "I suggest to you that you are a sympathizer who deliberately used your body as a barricade to buy time for the rioters." },
                    { "turn": 18, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "你簡直係含血噴人！我正正經經一個街坊，見到有公物快啲被人撞爛去幫手，反而俾你哋砌生豬肉，真係無天理！", "text_en": "你簡直係含血噴人！我正正經經一個街坊，見到有公物快啲被人撞爛去幫手，反而俾你哋砌生豬肉，真係無天理！", "targetText_zh": "你簡直係含血噴人！我正正經經一個街坊，見到有公物快啲被人撞爛去幫手，反而俾你哋砌生豬肉，真係無天理！", "targetText_en": "You are simply making malicious accusations! I am a proper neighborhood resident. I went to help when I saw public property was about to be crashed, but instead I got framed by you guys. This is truly unreasonable!" },
                    { "turn": 19, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Let me put it to you finally: your entire testimony today is a calculated lie designed to evade criminal responsibility for obstructing police officers in the due execution of their duties.", "text_en": "Let me put it to you finally: your entire testimony today is a calculated lie designed to evade criminal responsibility for obstructing police officers in the due execution of their duties.", "targetText_zh": "等我最後向你指出：你今日嘅全部證供都係一個經過算計嘅大話，目的係為咗逃避阻撓警務人員正當執行職務嘅刑事責任。", "targetText_en": "Let me put it to you finally: your entire testimony today is a calculated lie designed to evade criminal responsibility for obstructing police officers in the due execution of their duties." },
                    { "turn": 20, "role_zh": "被告 陳大文", "role_en": "Defendant Chan", "lang": "zh-HK", "text_zh": "我絕對不同意。我講嘅全部都係事實，我無阻差辦公，更加無講大話，你哋要點屈我都無辦法！", "text_en": "我絕對不同意。我講嘅全部都係事實，我無阻差辦公，更加無講大話，你哋要點屈我都無辦法！", "targetText_zh": "我絕對不同意。我講嘅全部都係事實，我無阻差辦公，更加無講大話，你哋要點屈我都無辦法！", "targetText_en": "I absolutely disagree. Everything I said is the truth. I did not obstruct police officers, nor did I tell lies. If you guys want to frame me, there is nothing I can do!" }
                ]
            },
            {
                id: "preset_escc_3151_2024",
                title_zh: "刑事 ➜ 高級警司涉非禮下屬案 (ESCC 3151/2024)",
                title_en: "Criminal ➜ Superintendent Indecent Assault (ESCC 3151/2024)",
                category: "criminal",
                desc_zh: "高級警司涉嫌在飯局中三度非禮女下屬。考驗大量廣東話職場俚語（如：抽水、著小鞋、大石砸死蟹、砌生豬肉等）的法庭雙向傳譯能力。包含控方主問及辯方盤問。",
                desc_en: "A Senior Superintendent is accused of indecently assaulting a female subordinate. Tests interpretation of Cantonese workplace slang and idioms during rigorous cross-examination.",
                dialogue: [
                    { "turn": 1, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Miss X, during the dinner on that day, did the defendant make any inappropriate comments to you?", "text_en": "Miss X, during the dinner on that day, did the defendant make any inappropriate comments to you?", "targetText_zh": "X 小姐，喺嗰日嘅晚宴期間，被告有冇對你發表任何不當嘅言論？", "targetText_en": "Miss X, during the dinner on that day, did the defendant make any inappropriate comments to you?" },
                    { "turn": 2, "role_zh": "事主 X", "role_en": "Victim X", "lang": "zh-HK", "text_zh": "係，佢無啦啦問我對啲有老婆嘅男人「受唔受落」，我覺得好核突，根本係「抽水」。", "text_en": "Yes, out of nowhere he asked me if I would be 'receptive' to married men. I felt it was disgusting and it was basically taking advantage of me.", "targetText_zh": "係，佢無啦啦問我對啲有老婆嘅男人「受唔受落」，我覺得好核突，根本係「抽水」。", "targetText_en": "Yes, out of nowhere he asked me if I would be receptive to married men. I felt it was disgusting, and it was basically taking advantage of me." },
                    { "turn": 3, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "How did you react when he grabbed your shoulder and pulled you closer?", "text_en": "How did you react when he grabbed your shoulder and pulled you closer?", "targetText_zh": "當佢捉住你膊頭，將你拉近嘅時候，你有咩反應？", "targetText_en": "How did you react when he grabbed your shoulder and pulled you closer?" },
                    { "turn": 4, "role_zh": "事主 X", "role_en": "Victim X", "lang": "zh-HK", "text_zh": "我想推開佢，但佢係我上司，簡直係「大石砸死蟹」，我唯有「硬食」。", "text_en": "I wanted to push him away, but he is my superior. It was simply the big crushing the small, I had no choice but to swallow it.", "targetText_zh": "我想推開佢，但佢係我上司，簡直係「大石砸死蟹」，我唯有「硬食」。", "targetText_en": "I wanted to push him away, but he is my superior. It was simply the big crushing the small; I had no choice but to put up with it." },
                    { "turn": 5, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "I put it to you that the physical contact was merely accidental in a crowded room.", "text_en": "I put it to you that the physical contact was merely accidental in a crowded room.", "targetText_zh": "我向你指出，喺一個擁擠嘅房間裏面，嗰啲身體接觸只不過係意外。", "targetText_en": "I put it to you that the physical contact was merely accidental in a crowded room." },
                    { "turn": 6, "role_zh": "事主 X", "role_en": "Victim X", "lang": "zh-HK", "text_zh": "絕對唔係！佢隻手直情摸到我背脊「出水」，點會係唔小心？", "text_en": "Absolutely not! His hand literally touched my back to the point of making me sweat, how could it be accidental?", "targetText_zh": "絕對唔係！佢隻手直情摸到我背脊「出水」，點會係唔小心？", "targetText_en": "Absolutely not! His hand literally touched my back to the point of making me sweat; how could it be accidental?" },
                    { "turn": 7, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Did you delay your report because you were actually calculating how to frame him?", "text_en": "Did you delay your report because you were actually calculating how to frame him?", "targetText_zh": "你延遲報告，係咪因為你實際上喺度算計緊點樣去誣陷佢？", "targetText_en": "Did you delay your report because you were actually calculating how to frame him?" },
                    { "turn": 8, "role_zh": "事主 X", "role_en": "Victim X", "lang": "zh-HK", "text_zh": "唔係！我係驚佢「秋後算帳」，驚佢喺工作上畀我「著小鞋」，絕對唔係有機心！", "text_en": "No! I was afraid he would settle scores with me later, afraid he would make things difficult for me at work. I was absolutely not being calculating!", "targetText_zh": "唔係！我係驚佢「秋後算帳」，驚佢喺工作上畀我「著小鞋」，絕對唔係有機心！", "targetText_en": "No! I was afraid he would settle scores with me later, and afraid he would make things difficult for me at work. I was absolutely not being scheming!" },
                    { "turn": 9, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "I suggest to you that you are making up stories to damage his reputation.", "text_en": "I suggest to you that you are making up stories to damage his reputation.", "targetText_zh": "我向你指出，你係喺度捏造故事，以損害佢嘅聲譽。", "targetText_en": "I suggest to you that you are making up stories to damage his reputation." },
                    { "turn": 10, "role_zh": "事主 X", "role_en": "Victim X", "lang": "zh-HK", "text_zh": "我絕對冇「吹水」！我句句屬實，點會無端端「砌佢生豬肉」？", "text_en": "I was not talking nonsense! Every word I said is true, why would I frame him for no reason?", "targetText_zh": "我絕對冇「吹水」！我句句屬實，點會無端端「砌佢生豬肉」？", "targetText_en": "I was not making things up! Every word I said is true; why would I frame him for no reason?" },
                    { "turn": 11, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Superintendent, did you intentionally touch her back during the gathering?", "text_en": "Superintendent, did you intentionally touch her back during the gathering?", "targetText_zh": "警司，喺聚會期間你有冇蓄意觸摸佢背部？", "targetText_en": "Superintendent, did you intentionally touch her back during the gathering?" },
                    { "turn": 12, "role_zh": "被告 (高級警司)", "role_en": "Defendant (Supt.)", "lang": "zh-HK", "text_zh": "絕對無。當時現場好多人，我只係想拍下佢膊頭，鼓勵下下屬，完全無非禮嘅意圖。", "text_en": "Absolutely not. There were many people at the scene. I merely wanted to pat her shoulder to encourage a subordinate, without any intention of indecent assault.", "targetText_zh": "絕對無。當時現場好多人，我只係想拍下佢膊頭，鼓勵下下屬，完全無非禮嘅意圖。", "targetText_en": "Absolutely not. There were many people at the scene. I merely wanted to pat her shoulder to encourage a subordinate, and had absolutely no intention of indecent assault." },
                    { "turn": 13, "role_zh": "辯方大律師", "role_en": "Defense Counsel", "lang": "en-US", "text_zh": "Did you say anything regarding 'married men' to her?", "text_en": "Did you say anything regarding 'married men' to her?", "targetText_zh": "你有向佢提及過任何關於「有老婆嘅男人」嘅說話？", "targetText_en": "Did you say anything regarding 'married men' to her?" },
                    { "turn": 14, "role_zh": "被告 (高級警司)", "role_en": "Defendant (Supt.)", "lang": "zh-HK", "text_zh": "嗰啲只係飲大咗之後嘅玩笑，即係俗語話「吹水」，絕對冇暗示要同佢發生關係。", "text_en": "Those were just jokes after drinking too much, which is colloquially called 'talking nonsense'. There was absolutely no implication of having a sexual relationship with her.", "targetText_zh": "嗰啲只係飲大咗之後嘅玩笑，即係俗語話「吹水」，絕對冇暗示要同佢發生關係。", "targetText_en": "Those were merely jokes after drinking too much, which is colloquially known as 'talking nonsense'. There was absolutely no implication of having a sexual relationship with her." },
                    { "turn": 15, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "I suggest to you that you used your superior rank to force her into submission.", "text_en": "I suggest to you that you used your superior rank to force her into submission.", "targetText_zh": "我向你指出，你利用你嘅上級職銜去迫使佢屈服。", "targetText_en": "I suggest to you that you used your superior rank to force her into submission." },
                    { "turn": 16, "role_zh": "被告 (高級警司)", "role_en": "Defendant (Supt.)", "lang": "zh-HK", "text_zh": "我不同意。我從來無用職權壓迫任何人，佢話我「大石砸死蟹」係誇大其詞。", "text_en": "I disagree. I have never used my authority to oppress anyone. Her claim that I was 'the big crushing the small' is an exaggeration.", "targetText_zh": "我不同意。我從來無用職權壓迫任何人，佢話我「大石砸死蟹」係誇大其詞。", "targetText_en": "I disagree. I have never used my authority to oppress anyone. Her claim that I was 'the big crushing the small' is an exaggeration." },
                    { "turn": 17, "role_zh": "主控官", "role_en": "Prosecutor", "lang": "en-US", "text_zh": "Are you denying that you pulled her towards you despite her obvious reluctance?", "text_en": "Are you denying that you pulled her towards you despite her obvious reluctance?", "targetText_zh": "你係咪否認，儘管佢明顯不情願，你仍然將佢拉向你？", "targetText_en": "Are you denying that you pulled her towards you despite her obvious reluctance?" },
                    { "turn": 18, "role_zh": "被告 (高級警司)", "role_en": "Defendant (Supt.)", "lang": "zh-HK", "text_zh": "佢當時無反抗，亦無表現出唔開心，我以為佢「受落」呢種打招呼嘅方式。", "text_en": "She did not resist at that time, nor did she show any unhappiness. I thought she was receptive to this way of greeting.", "targetText_zh": "佢當時無反抗，亦無表現出唔開心，我以為佢「受落」呢種打招呼嘅方式。", "targetText_en": "She did not resist at that time, nor did she show any unhappiness. I thought she was receptive to this way of greeting." },

        // FALLBACK LOCAL HEURISTIC SCORING ENGINE
        function evaluateTranslationQuality(userInput, targetText, langDirection) {
            const inputClean = (userInput || "").trim();
            const targetClean = (targetText || "").trim();
            
            if (!inputClean) {
                return {
                    engine: "local",
                    scores: { accuracy: 1.0, tone: 1.0, legal: 1.0, delivery: 1.0, overall: 1.0 },
                    strengths: ["無 (None)"],
                    improvements: ["學員未有作答。請務必進行口譯。 (No input detected. Please provide your interpretation.)"]
                };
            }

            let strengths = [];
            let improvements = [];
            
            const inputLen = inputClean.length;
            const targetLen = targetClean.length;
            const lengthRatio = inputLen / targetLen;

            let overlapRatio = 0;
            if (langDirection === "en-to-zh") {
                const inputChars = new Set([...inputClean.replace(/[\s,，。！?？\.「」『』]/g, "")]);
                const targetChars = [...targetClean.replace(/[\s,，。！?？\.「」『』]/g, "")];
                let matchedChars = 0;
                targetChars.forEach(char => {
                    if (inputChars.has(char)) matchedChars++;
                });
                overlapRatio = targetChars.length ? (matchedChars / targetChars.length) : 0;
            } else {
                const inputWords = new Set((inputClean.toLowerCase().match(/\b\w+\b/g) || []));
                const targetWords = (targetClean.toLowerCase().match(/\b\w+\b/g) || []);
                let matchedWords = 0;
                targetWords.forEach(word => {
                    if (inputWords.has(word)) matchedWords++;
                });
                overlapRatio = targetWords.length ? (matchedWords / targetWords.length) : 0;
            }

            let accuracy = 1.0 + (overlapRatio * 3.5);
            let tone = 1.0 + (overlapRatio * 3.2);
            let legal = 1.0 + (overlapRatio * 3.0);
            let delivery = lengthRatio >= 0.75 && lengthRatio <= 1.3 ? 4.7 : (lengthRatio < 0.5 ? 2.5 : 3.6);

            if (lengthRatio < 0.4) {
                accuracy -= 1.2; tone -= 1.0; legal -= 1.0;
                improvements.push("譯文長度嚴重不足。請確保將原聲陳述的所有實質性事實、細節全數譯出。");
            } else if (lengthRatio > 1.6) {
                delivery -= 1.2;
                improvements.push("譯文存在冗餘或贅述（Garrulous Interpretation）。法庭傳譯應追求精練準確，避免過度解說。");
            }

            if (langDirection === "en-to-zh") {
                const hasLegalPrefix = /向.*指出|指出|提出/.test(inputClean);
                const targetHasPrefix = /向.*指出|指出|提出/.test(targetClean);
                if (targetHasPrefix && !hasLegalPrefix) {
                    legal -= 1.0;
                    improvements.push("漏譯交叉盤問要件語：原聲包含律師盤問格式語，應譯出『我向你指出/提出 (I suggest/put it to you)』。");
                } else if (hasLegalPrefix) {
                    legal += 0.4;
                    strengths.push("精準捕捉並還原了英美法系交叉盤問（Cross-examination）的核心法律格式語。");
                }

                const hasColloquialParticles = /[囉嘛啫㗎啦吖]/.test(inputClean);
                const targetHasColloquial = /[囉嘛啫㗎啦吖]/.test(targetClean);
                if (targetHasColloquial && !hasColloquialParticles) {
                    tone -= 0.6;
                    improvements.push("譯文法律修辭正確，但遺漏了證人原供詞中的香港口語助詞（囉/嘛/啫），建構情感原貌略嫌僵化。");
                } else if (hasColloquialParticles) {
                    tone += 0.3;
                    strengths.push("成功傳神保留香港地道供詞特徵（Modal Particles），貼合證言事實原貌原則。");
                }
            } else {
                const lowerInput = inputClean.toLowerCase();
                const hasEnglishPrefix = /\b(suggest|put\s+it\s+to\s+you|challenge|assert|seriously\s+tell)\b/.test(lowerInput);
                const targetHasEnglishPrefix = /\b(suggest|put\s+it\s+to\s+you|challenge|assert|seriously\s+tell)\b/.test(targetClean.toLowerCase());
                
                if (targetHasEnglishPrefix && !hasEnglishPrefix) {
                    legal -= 1.0;
                    improvements.push("Missing foundational common-law defense/prosecution framing words (e.g., 'I suggest to you that...').");
                } else if (hasEnglishPrefix) {
                    legal += 0.4;
                    strengths.push("Excellent appropriation of adversarial legal discourse markers inside common-law settings.");
                }

                const targetHasPast = /\b(was|were|did|had|went|said|saw|felt|squeezed|pushed|obstructed|fabricated)\b/i.test(targetClean);
                const inputHasPast = /\b(was|were|did|had|went|said|saw|felt|squeezed|pushed|obstructed|fabricated|ed)\b/i.test(lowerInput);
                if (targetHasPast && !inputHasPast) {
                    accuracy -= 0.6;
                    improvements.push("請注意【案發時態合規性】：案情事實屬過去發生的歷史事實（Past facts），傳譯動詞應嚴格使用過去式。");
                } else if (inputHasPast) {
                    strengths.push("時態（Tense Verification）處理妥當，精準鎖定案發現場時間線屬性。");
                }
            }

            const targetNumbers = targetClean.match(/\d+/g);
            if (targetNumbers) {
                let missingNum = false;
                targetNumbers.forEach(num => {
                    if (!inputClean.includes(num)) missingNum = true;
                });
                if (missingNum) {
                    accuracy -= 1.0;
                    legal -= 0.5;
                    improvements.push("⚠️ 嚴重警告：漏譯案情關鍵核心數字（如距離、時間、次數）。在司法定罪評估中，數字出錯屬於嚴重失實。");
                }
            }

            accuracy = Math.max(1.0, Math.min(5.0, Number(accuracy.toFixed(1))));
            tone = Math.max(1.0, Math.min(5.0, Number(tone.toFixed(1))));
            legal = Math.max(1.0, Math.min(5.0, Number(legal.toFixed(1))));
            delivery = Math.max(1.0, Math.min(5.0, Number(delivery.toFixed(1))));
            
            if (inputLen < 6) {
                accuracy = Math.min(accuracy, 1.5);
                tone = Math.min(tone, 1.5);
                legal = Math.min(legal, 1.5);
                delivery = Math.min(delivery, 1.5);
                improvements = ["輸入長度嚴重殘缺，無法進行司法核證評估 (Input too short for evaluation)。"];
            }

            if (strengths.length === 0) strengths.push("譯文語意大體對位，完成了基礎事實框架的搭建。");
            if (improvements.length === 0) improvements.push("口譯表現高度契合司法標準！請繼續保持此字斟句酌的核證水平。");

            const overall = Number(((accuracy + tone + legal + delivery) / 4).toFixed(1));

            return {
                engine: "local",
                scores: { accuracy, tone, legal, delivery, overall },
                strengths,
                improvements
            };
        }

                    requestBody.voice = speakerRole === "questioner" ? "onyx" : "nova";

                        ? "Speak in authentic, natural Hong Kong Cantonese (廣東話) with realistic courtroom witness emotion and colloquial tone."

                }

                const response = await fetch("https://openrouter.ai/api/v1/audio/speech", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiToUse}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href || "https://augustinehk.github.io/CLS-AI/",
                        "X-Title": "Court Interpreter AI Suite (CLS)"

                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`OpenRouter TTS HTTP ${response.status}: ${errText}`);
                }

                const contentType = response.headers.get("Content-Type") || "audio/mpeg";
                const arrayBuffer = await response.arrayBuffer();

                if (contentType.includes("audio/pcm")) {
                    const rateMatch = contentType.match(/rate=(\d+)/);
                    const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                    return pcmToWavBlob(arrayBuffer, sampleRate, 1);
